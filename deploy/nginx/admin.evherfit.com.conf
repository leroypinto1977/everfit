# Admin panel — https://admin.evherfit.com
#
#   sudo cp deploy/nginx/admin.evherfit.com.conf /etc/nginx/sites-available/admin.evherfit.com
#   sudo ln -s /etc/nginx/sites-available/admin.evherfit.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.evherfit.com
#
# A separate server block on a separate hostname is the whole point of the app
# split: nothing on evherfit.com ever proxies to port 3001.

server {
    listen 80;
    listen [::]:80;
    server_name admin.evherfit.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://admin.evherfit.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.evherfit.com;

    # ssl_certificate / ssl_certificate_key are inserted by certbot

    # Belt and braces on top of the app's own headers and robots.txt.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # CSV exports and label/invoice pages; nothing here takes large uploads.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The session cookie is set with `secure: true` in production — without the
    # forwarded scheme Next sees plain http and sign-in silently never sticks.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        # Revenue and analytics pages run wide aggregate queries.
        proxy_read_timeout 120s;
    }

    # Optional second gate, replacing Vercel's Deployment Protection. Generate
    # with: sudo htpasswd -c /etc/nginx/.htpasswd-admin <name>
    # auth_basic "EVHERFIT";
    # auth_basic_user_file /etc/nginx/.htpasswd-admin;
}
