# Storefront — https://evherfit.com
#
#   sudo cp deploy/nginx/evherfit.com.conf /etc/nginx/sites-available/evherfit.com
#   sudo ln -s /etc/nginx/sites-available/evherfit.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d evherfit.com -d www.evherfit.com
#
# certbot rewrites the listen/ssl lines below in place on first run.

server {
    listen 80;
    listen [::]:80;
    server_name evherfit.com www.evherfit.com;

    # certbot manages this block after the first run; until then it serves the
    # ACME challenge and redirects everything else.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://evherfit.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.evherfit.com;
    # ssl_certificate lines are inserted by certbot
    return 301 https://evherfit.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evherfit.com;

    # ssl_certificate / ssl_certificate_key are inserted by certbot

    # Razorpay posts webhooks here; Next reads the raw body to verify the HMAC
    # signature, so nothing may rewrite or buffer-mangle it.
    client_max_body_size 2m;

    # Next's own Cache-Control headers are the source of truth for ISR.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Without this Next builds http:// URLs behind TLS and the Razorpay
    # checkout callback comes back on the wrong scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Immutable build assets: hashed filenames, safe to cache hard at the edge.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        # Payment verification can sit waiting on Razorpay; the default 60s
        # read timeout would cut a legitimate confirmation off.
        proxy_read_timeout 120s;
    }
}
